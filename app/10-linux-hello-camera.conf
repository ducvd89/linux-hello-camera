# polkit's password helper runs sandboxed. The face check itself happens in linux-hello-camerad
# (it opens the camera), so the helper needs no devices. The confirmation step for admin prompts
# does need two things:
[Service]
# confirm-broker creates its socket for the "Making sure it's you" dialog here (/run is read-only)
ReadWritePaths=-/run/linux-hello-camera
# The dialog opens in your desktop session, through /run/user/<uid> (session bus, Wayland
# socket), which ProtectHome=yes hides completely. Read-only is enough to connect to sockets.
ProtectHome=read-only
